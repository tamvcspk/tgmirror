# Phase 13, first slice (docs/06-lo-trinh.md, "Phase 13 — ghi chú"): tests, a wheel/sdist attached
# to the GitHub Release, the Docker image pushed to Docker Hub, and the same wheel/sdist published
# to PyPI over Trusted Publishing (OIDC, Phase 14 — no token stored in the repo). A Windows
# PyInstaller binary and a winget-pkgs update job were added in the Phase 14 winget slice below; a
# Linux PyInstaller binary and the APT/RPM repo and AUR are still deliberately not here — each
# needs its own external account/secret setup with the user first.
#
# T4, Phase 15b: split from one job into five, each with only the permissions it needs — the job
# that holds the Docker Hub secret no longer also has `contents: write` (it never needed it), and
# `:latest` is pointed at a version only after the GitHub Release and the PyPI publish have both
# already succeeded (`docker-latest`, re-tagging the already-pushed version image via `docker
# buildx imagetools create` — no rebuild). A version-specific Docker tag still goes out earlier,
# alongside the wheel/sdist: it is not a moving target the way `:latest` is, so it carries none of
# that ordering risk. If a later job fails, the earlier ones' results (the version-tagged image,
# the PyPI release, the GitHub Release) already stand and do not need to be redone — only re-run
# the job that failed (and anything after it that still depends on it).
#
# Phase 14 (winget slice, 2026-09-28): `pyinstaller-windows` builds the onedir binary
# (`pyinstaller.spec`) and zips it for `github-release` to attach — that zip is the asset the first,
# manual `wingetcreate new` submission needs (docs/06-lo-trinh.md, "Đã chốt" mục 6). `winget-release`
# automates *later* winget-pkgs updates via `vedantmgoyal9/winget-releaser`; it was deliberately
# added in a separate commit from `pyinstaller-windows` so the commit tagged `v0.1.1` never carried
# a job that could try to touch winget-pkgs before the manual first submission (and the package id
# it claims) exists there — see "Phase 14 — ghi chú" for why.

name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build, test and package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          # pyproject.toml's floor and the Docker image's base (T4, Phase 15b): this gate runs on
          # the actual minimum supported version, not whatever the runner's default happens to be.
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Check the tag matches pyproject.toml's version
        id: version
        run: |
          set -euo pipefail
          PY_VERSION=$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PY_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::tag v$TAG_VERSION does not match pyproject.toml version $PY_VERSION"
            exit 1
          fi
          echo "version=$PY_VERSION" >> "$GITHUB_OUTPUT"

      - name: Determine prerelease status
        id: meta
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          IS_PRERELEASE=false
          # a pre-release version (e.g. 0.2.0rc1) never becomes `:latest` or a non-prerelease Release
          if [[ "$VERSION" =~ (a|b|rc|dev)[0-9] ]]; then
            IS_PRERELEASE=true
          fi
          echo "prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format --check
        run: uv run ruff format --check .

      - name: pytest
        run: uv run pytest

      - name: Build wheel and sdist
        run: uv build

      - name: Upload the wheel/sdist for the PyPI/GitHub Release jobs
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/*.whl
            dist/*.tar.gz

      - name: Smoke test the wheel in a clean venv
        run: |
          set -euo pipefail
          uv venv /tmp/smoke-venv
          uv pip install --python /tmp/smoke-venv/bin/python dist/*.whl
          /tmp/smoke-venv/bin/tgmirror --version
          /tmp/smoke-venv/bin/tgmirror --help

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS

      - name: Upload the checksums for the GitHub Release job
        uses: actions/upload-artifact@v4
        with:
          name: checksums
          path: dist/SHA256SUMS

  pyinstaller-windows:
    name: Build the Windows PyInstaller binary (winget)
    needs: build
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Install dependencies (including PyInstaller)
        run: uv sync --frozen --group pyinstaller

      - name: Build the onedir binary
        run: uv run pyinstaller pyinstaller.spec

      - name: Smoke test the binary
        working-directory: dist/tgmirror
        run: |
          ./tgmirror.exe --version
          ./tgmirror.exe --help
          ./tgmirror.exe doctor

      - name: "Package the onedir build as a zip (winget InstallerType: zip)"
        working-directory: dist
        run: Compress-Archive -Path tgmirror -DestinationPath "tgmirror-${{ needs.build.outputs.version }}-windows-x64.zip"

      - name: Upload the zip for the GitHub Release and winget jobs
        uses: actions/upload-artifact@v4
        with:
          name: pyinstaller-windows
          path: dist/*.zip

  docker:
    name: Build and push the Docker image (version tag only, never :latest here)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build the image (load only, for the smoke test)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: tgmirror:smoke

      - name: Smoke test the image
        run: |
          docker run --rm tgmirror:smoke --help
          docker run --rm tgmirror:smoke doctor

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push the version-tagged image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: docker.io/tamvo1808/tgmirror:${{ needs.build.outputs.version }}

  github-release:
    name: GitHub Release
    needs: [build, pyinstaller-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the wheel/sdist built by the build job
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Download the checksums built by the build job
        uses: actions/download-artifact@v4
        with:
          name: checksums
          path: dist

      - name: Download the Windows zip built by the pyinstaller-windows job
        uses: actions/download-artifact@v4
        with:
          name: pyinstaller-windows
          path: dist

      - name: GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ needs.build.outputs.prerelease }}

  publish-pypi:
    name: Publish to PyPI (Trusted Publishing)
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/tgmirror/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write # OIDC token for Trusted Publishing; no API token/secret needed
    steps:
      - name: Download the wheel/sdist built by the build job
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true # a re-run after a later step failed does not fail on files already up

  docker-latest:
    name: Point :latest at this version
    # Only after the version-tagged image, the GitHub Release and the PyPI publish have all
    # already succeeded (T4, Phase 15b) — `:latest` is a moving target other machines may already
    # be pulling automatically, so it should never point at a release that is only half out.
    needs: [build, docker, github-release, publish-pypi]
    if: needs.build.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Re-tag the already-pushed version image as :latest (no rebuild)
        run: |
          docker buildx imagetools create \
            --tag docker.io/tamvo1808/tgmirror:latest \
            docker.io/tamvo1808/tgmirror:${{ needs.build.outputs.version }}

  winget-release:
    name: Submit the new version to winget-pkgs
    # Never for a pre-release (winget only tracks stable versions), and only after github-release
    # has attached the zip this reads. This job only *updates* an existing manifest — the first
    # submission for a brand new package id is a manual `wingetcreate new` run to claim
    # `tamvcspk.tgmirror` (docs/06-lo-trinh.md, "Đã chốt" mục 6), kept out of the commit that got
    # tagged `v0.1.1` (see the top-of-file comment) since that manual submission needs v0.1.1's own
    # release assets to exist first. This job can still land on `main` before the manual step and
    # the `WINGET_PAT` secret are both in place, so the one step below stays guarded on the secret
    # being set rather than assuming it already is.
    needs: [build, github-release]
    if: needs.build.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      WINGET_PAT: ${{ secrets.WINGET_PAT }}
    steps:
      - name: Submit to winget-pkgs
        if: env.WINGET_PAT != ''
        uses: vedantmgoyal9/winget-releaser@main
        with:
          identifier: tamvcspk.tgmirror
          installers-regex: '\.zip$'
          token: ${{ secrets.WINGET_PAT }}
